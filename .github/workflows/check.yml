# Runs the same verification harness as the require-check Stop hook.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Arch is the only target platform, so the gate runs where the code runs
  # (e.g. `mv --exchange` needs coreutils >= 9.5; Ubuntu 24.04 ships 9.4).
  # Arch's shfmt and actionlint are the versions used locally.
  check:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git make jq ripgrep shellcheck shfmt actionlint \
            sqlite restic socat python util-linux openssl procps-ng diffutils
          shfmt --version
          actionlint --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check

  # Recovery drill on a clean Arch: install the dotfiles, back up a memory,
  # lose the machine, rebuild it and restore the memory.
  recovery:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - name: Install the packages a new machine needs
        run: pacman -Sy --noconfirm --needed git jq ripgrep restic sqlite openssl procps-ng
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recovery drill
        run: bash scripts/recovery-e2e.sh
