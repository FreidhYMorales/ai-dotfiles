# Runs the same verification harness as the require-check Stop hook.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Arch is the only target platform, so the gate runs where the code runs
  # (e.g. `mv --exchange` needs coreutils >= 9.5; Ubuntu 24.04 ships 9.4).
  # Arch's shfmt and actionlint are the versions used locally.
  # The test files are split over two runners (TEST_SHARD, scripts/run-tests.sh):
  # one 2-core runner under the whole parallel suite made timing tests flaky
  # and the job ran close to its timeout.
  check:
    name: check (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git make jq ripgrep shellcheck shfmt actionlint zellij bubblewrap \
            sqlite restic socat python util-linux openssl procps-ng diffutils gitleaks \
            nodejs npm
          shfmt --version
          actionlint --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The look mod tests run on the Claude Code build pinned in
      # plugins/look/tests/claude-code.version (`claude plugin validate|test`
      # need no auth). The pinned install runs the package's own installer.
      - name: Install pinned Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat plugins/look/tests/claude-code.version)"
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: make check
        env:
          LOOK_REQUIRE_CLAUDE: "1"
          TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check

  # Recovery drill on a clean Arch: install the dotfiles, back up a memory,
  # lose the machine, rebuild it and restore the memory
  # (from the backup drive and from a clone of the off-site git repo).
  recovery:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      # git first, so checkout makes a real clone; the rest from docs/recovery.md.
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the packages docs/recovery.md lists
        # One package per word: the split is the point.
        run: |
          # shellcheck disable=SC2046
          pacman -S --noconfirm --needed $(bash scripts/recovery-packages.sh)
      - name: Recovery drill
        run: bash scripts/recovery-e2e.sh
