schema: spec-driven
context: |
  Project: dotfiles ia (bash-based Claude Code dotfiles).
  Stack: bash scripts (bin/, scripts/), Claude Code plugins (flow, sdd, toolkit) with markdown skills and hook scripts, JSON settings, systemd units.
  Quality gate: `make check` (shell, json, structure, settings, skills, workflows, tests). gitleaks runs in pre-commit and CI (.github/workflows/check.yml).
  Tests are plain bash scripts: scripts/tests/*.test.sh and plugins/*/hooks/tests/*.test.sh, run in parallel by scripts/run-tests.sh.
  Convention files: no AGENTS.md or project CLAUDE.md; user-level ~/.claude/CLAUDE.md applies. Docs in docs/ (local-workers.md, recovery.md, plans/).
  Commits: conventional commits, no AI attribution.
strict_tdd: true
testing:
  test_command: make check
  targeted_test_command: bash scripts/tests/<name>.test.sh
  hook_test_command: bash plugins/<plugin>/hooks/tests/<name>.test.sh
  runner: plain bash (scripts/run-tests.sh)
  layers:
    unit: true
    integration: true
    e2e: partial   # scripts/recovery-e2e.sh (fresh-machine recovery rehearsal in CI)
  coverage:
    available: false
  mutation:
    available: true
    command: make mutate
  quality:
    linter: shellcheck (scripts/check-shell.sh)
    formatter: shfmt (scripts/check-shell.sh)
    type_checker: none
    secrets: gitleaks (pre-commit, CI)
rules:
  proposal:
    - Keep changes within the 400-line review budget; split into chained PRs otherwise.
  specs:
    - Use Given/When/Then scenarios; specs describe observable script/hook/skill behavior.
  design:
    - Prefer plain bash and existing scripts/lib.sh helpers; no new runtime dependencies.
  tasks:
    - Write the failing *.test.sh first (Strict TDD), then the implementation.
  apply:
    - Run the targeted test file first, then `make check` before finishing.
  verify:
    - `make check` must pass; report any step that fails.
  archive:
    - Sync delta specs into openspec/specs before moving the change to archive.
